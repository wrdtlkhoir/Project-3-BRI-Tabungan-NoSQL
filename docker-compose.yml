# bri-tabungan-nosql — lingkungan LOKAL (Docker Desktop)
#   Couchbase CE  = main database (data operasional + saldo + outbox)
#   Cassandra     = Event Ledger (append-only)
#   PostgreSQL    = hanya sumber data seed (dump Project 2), dipakai sekali
#
#   docker compose up -d
#   (tunggu couchbase-init & postgres-restore "exited (0)")
#   python scripts/load_all.py     # muat data ke Couchbase + Cassandra
#   python scripts/build_indexes.py
#   uvicorn app.main:app --port 8000
services:
  postgres:
    image: postgres:16-alpine
    container_name: bri-postgres
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tabungan_bri
      TZ: UTC
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tabungan_bri"]
      interval: 5s
      timeout: 5s
      retries: 30

  cassandra:
    image: cassandra:5.0
    container_name: bri-cassandra
    environment:
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 200M
    ports: ["9042:9042"]
    volumes: [cassandradata:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -qw UN"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  couchbase:
    image: couchbase/server:community-7.6.1
    container_name: bri-couchbase
    ports:
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
      - "11210:11210"
    volumes: [couchbasedata:/opt/couchbase/var]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8091/ui/index.html"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  postgres-restore:
    image: postgres:16-alpine
    container_name: bri-pg-restore
    depends_on:
      postgres: {condition: service_healthy}
    environment: {PGPASSWORD: password, PGHOST: postgres, PGUSER: postgres}
    volumes:
      - ./infra/cassandra/tabungan_bri.dump:/dump/tabungan_bri.dump:ro
      - ./infra/docker/pg_restore.sh:/scripts/pg_restore.sh:ro
    entrypoint: ["/bin/sh", "/scripts/pg_restore.sh"]

  couchbase-init:
    image: couchbase/server:community-7.6.1
    container_name: bri-couchbase-init
    depends_on:
      couchbase: {condition: service_healthy}
    environment:
      CB_HOST: couchbase:8091
      CB_USER: Administrator
      CB_PASS: password
      CB_BUCKET: bri_tabungan
    volumes: ["./infra/couchbase:/cb:ro"]
    entrypoint: ["/bin/sh", "/cb/cb_init.sh"]

volumes:
  pgdata:
  cassandradata:
  couchbasedata:
